services:
  - type: web
    name: open-ews
    env: ruby
    region: oregon
    plan: free
    buildCommand: |
      bundle install
      yarn install --check-files || true
      bundle exec rake assets:precompile
      bundle exec rake db:migrate
      bundle exec rake db:seed
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: open-ews-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false  # You’ll paste this manually later (from config/master.key)
    buildFilter:
      paths:
        - "**/*"

databases:
  - name: open-ews-db
    plan: free
    region: oregon
