services:
  - type: web
    name: open-ews
    env: ruby
    buildCommand: bundle install && rails db:migrate
    startCommand: rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openews-db
          property: connectionString

databases:
  - name: openews-db
    databaseName: openews
    user: openews_user
