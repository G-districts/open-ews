services:
  - type: web
    name: open-ews
    env: ruby
    plan: free
    region: oregon
    buildCommand: |
      # Install dependencies
      bundle install
      yarn install --check-files || true

      # Disable bootsnap in production (prevent SIGTERM)
      sed -i '/require "bootsnap\/setup"/c\# require "bootsnap/setup"' config/boot.rb

      # Precompile assets
      bundle exec rake assets:precompile

      # Run database migrations
      bundle exec rake db:migrate

      # Seed database with default admin credentials
      bundle exec rake db:seed

    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT

    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: open-ews-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        value: "<paste your config/master.key here>"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: OPENEWS_ADMIN_EMAIL
        value: admin@gdistrict.org
      - key: OPENEWS_ADMIN_PASSWORD
        value: 220099  # admin password you can log in with

databases:
  - name: open-ews-db
    plan: free
    region: oregon
