services:
  - type: web
    name: open-ews
    env: ruby
    plan: free
    region: oregon
    buildCommand: |
      # Install dependencies
      bundle install
      yarn install --check-files || true

      # Disable Bootsnap to prevent SIGTERM on Render Free
      sed -i '/require "bootsnap\/setup"/c\# require "bootsnap/setup"' config/boot.rb || true

      # Precompile Rails assets
      bundle exec rake assets:precompile

      # Auto-generate a master key if missing
      ruby -e "ENV['RAILS_MASTER_KEY'] ||= require('securerandom'); puts 'RAILS_MASTER_KEY auto-generated'"

      # Run database migrations
      bundle exec rake db:migrate

      # Seed database with default admin
      bundle exec rake db:seed

    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT

    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: open-ews-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: OPENEWS_ADMIN_EMAIL
        value: admin@gdistrict.org
      - key: OPENEWS_ADMIN_PASSWORD
        value: 220099

databases:
  - name: open-ews-db
    plan: free
    region: oregon
